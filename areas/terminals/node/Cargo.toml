[package]
name = "parvi-terminals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
parvi-core = { path = "../../../kit/core" }
parvi-node-kit = { path = "../../../kit/node-kit" }
parvi-term = { path = "../../../engine/term" }
parvi-terminals-contract = { path = "../contract" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "display"] }

[dev-dependencies]
parvi-testkit = { path = "../../../kit/testkit" }
vt100 = "0.16.2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29"
