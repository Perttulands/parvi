[package]
name = "parvi-terminals-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The terminals area's page in the app: sessions, windows and the terminal."
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-core = { path = "../../../kit/core" }
parvi-terminals-contract = { path = "../contract" }
parvi-work-contract = { path = "../../work/contract" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
alacritty_terminal = "0.26"
async-channel = "2"
image = { version = "0.25", default-features = false }
log = "0.4"
# Mermaid diagrams a session prints, drawn here: the common kinds only,
# each kind adds to the binary.
merman = { version = "0.10.0", default-features = false, features = ["svg", "diagram-flowchart", "diagram-sequence", "diagram-state", "diagram-class", "diagram-er", "diagram-gantt", "diagram-pie", "diagram-mindmap", "diagram-git-graph", "diagram-journey", "diagram-timeline"] }
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-terminals = { path = "../node" }
parvi-files = { path = "../../files/node" }
parvi-testkit = { path = "../../../kit/testkit" }
parvi-node-kit = { path = "../../../kit/node-kit" }
parvi-term = { path = "../../../engine/term" }
tokio = { version = "1", features = ["full"] }
