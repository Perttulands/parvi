[package]
name = "parvi-terminals-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The terminals area's page in the app: sessions, windows and the terminal."
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-core = { path = "../../../kit/core" }
parvi-terminals-contract = { path = "../contract" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
alacritty_terminal = "0.26"
async-channel = "2"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
