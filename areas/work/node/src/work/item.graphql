query($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      number title url state body createdAt updatedAt closedAt
      author { login }
      labels(first: 20) { nodes { name } }
      assignees(first: 10) { nodes { login } }
      parent { number repository { nameWithOwner } }
      subIssues(first: 100) { nodes { number repository { nameWithOwner } } }
      blockedBy(first: 50) { nodes { number repository { nameWithOwner } } }
      blocking(first: 50) { nodes { number repository { nameWithOwner } } }
      closedByPullRequestsReferences(first: 20, includeClosedPrs: true) { nodes { number } }
    }
  }
}
