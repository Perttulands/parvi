[package]
name = "parvi-host-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-core = { path = "../../../kit/core" }
parvi-host-contract = { path = "../contract" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
parvi-node-kit = { path = "../../../kit/node-kit" }
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-host = { path = "../node" }
parvi-testkit = { path = "../../../kit/testkit" }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
