[package]
name = "parvi-brain-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-brain-contract = { path = "../contract" }
parvi-core = { path = "../../../kit/core" }
parvi-app-kit = { path = "../../../kit/app-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-brain = { path = "../node" }
parvi-testkit = { path = "../../../kit/testkit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
