[package]
name = "parvi-agents-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-core = { path = "../../../kit/core" }
parvi-agents-contract = { path = "../contract" }
parvi-app-kit = { path = "../../../kit/app-kit" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
serde_json = "1"

[dev-dependencies]
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-agents = { path = "../node" }
parvi-testkit = { path = "../../../kit/testkit" }
parvi-node-kit = { path = "../../../kit/node-kit" }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
