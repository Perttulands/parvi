[package]
name = "parvi-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
parvi-agents-contract = { path = "../contract" }
parvi-core = { path = "../../../kit/core" }
parvi-node-kit = { path = "../../../kit/node-kit" }
parvi-missions = { path = "../../../engine/missions" }
axum = { version = "0.8", default-features = false, features = ["json"] }
parvi-term = { path = "../../../engine/term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
parvi-testkit = { path = "../../../kit/testkit" }
parvi-terminals = { path = "../../terminals/node" }

futures-util = "0.3"
tokio-tungstenite = "0.30"
