[package]
name = "parvi-scheduled-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-core = { path = "../../../kit/core" }
parvi-scheduled-contract = { path = "../contract" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Time"] }

[dev-dependencies]
parvi-app = { path = "../../../bin/parvi-app" }
parvi-scheduled = { path = "../node" }
parvi-terminals = { path = "../../terminals/node" }
parvi-testkit = { path = "../../../kit/testkit" }
parvi-node-kit = { path = "../../../kit/node-kit" }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
