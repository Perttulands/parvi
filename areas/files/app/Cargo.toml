[package]
name = "parvi-files-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-files-contract = { path = "../contract" }
parvi-terminals-contract = { path = "../../terminals/contract" }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["local-offset"] }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
image = { version = "0.25", default-features = false }
sha2 = "0.11"
hex = "0.4"
serde_json = "1"

parvi-core = { path = "../../../kit/core" }

[dev-dependencies]
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-files = { path = "../node" }
parvi-terminals = { path = "../../terminals/node" }
parvi-terminals-app = { path = "../../terminals/app" }
parvi-testkit = { path = "../../../kit/testkit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
