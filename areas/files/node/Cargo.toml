[package]
name = "parvi-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-core = { path = "../../../kit/core" }
parvi-node-kit = { path = "../../../kit/node-kit" }
parvi-term = { path = "../../../engine/term" }
anyhow = "1"
axum = { version = "0.8", features = ["query", "json"] }
futures-util = "0.3"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "macros", "time", "net"] }
parvi-files-contract = { path = "../contract" }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
parvi-testkit = { path = "../../../kit/testkit" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
