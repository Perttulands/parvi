[package]
name = "parvi-missions-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-core = { path = "../../../kit/core" }
parvi-missions-contract = { path = "../contract" }
parvi-agents-contract = { path = "../../agents/contract" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["local-offset", "parsing"] }

[dev-dependencies]
anyhow = "1"
http = "1"
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-missions = { path = "../node" }
parvi-work = { path = "../../work/node" }
parvi-testkit = { path = "../../../kit/testkit" }
parvi-node-kit = { path = "../../../kit/node-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
parvi-mission-engine = { path = "../../../engine/missions" }
parvi-term = { path = "../../../engine/term" }
