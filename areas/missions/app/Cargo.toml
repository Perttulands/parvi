[package]
name = "parvi-missions-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../../../kit/app-kit" }
parvi-core = { path = "../../../kit/core" }
parvi-missions-contract = { path = "../contract" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
serde_json = "1"

[dev-dependencies]
parvi-app-shell = { path = "../../../kit/app-shell" }
parvi-missions = { path = "../node" }
parvi-work = { path = "../../work/node" }
parvi-testkit = { path = "../../../kit/testkit" }
parvi-node-kit = { path = "../../../kit/node-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
