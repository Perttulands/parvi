name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo fmt --check
      # The app crates (parvi-app*, parvi-*-app) have their own job, with the
      # GUI toolkit's libraries; a new area's app crate needs no edit here.
      - run: cargo clippy --workspace --exclude 'parvi-app*' --exclude 'parvi-*-app' --all-targets -- -D warnings
      - run: cargo test --workspace --exclude 'parvi-app*' --exclude 'parvi-*-app'
        env:
          PARVI_REQUIRE_TMUX: "1"

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # gpui's X11 platform and its font stack; the tests draw on gpui's
      # test platform and need no display.
      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config
          libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev libfontconfig1-dev libfreetype-dev
      - run: cargo clippy -p 'parvi-app*' -p 'parvi-*-app' --all-targets -- -D warnings
      - run: cargo test -p 'parvi-app*' -p 'parvi-*-app'
