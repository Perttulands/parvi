[package]
name = "parvi-app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parvi's app shell: the window around the pages areas register."
publish = false

[lints]
workspace = true

[dependencies]
parvi-app-kit = { path = "../app-kit" }
parvi-core = { path = "../core" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
async-channel = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "io-util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
