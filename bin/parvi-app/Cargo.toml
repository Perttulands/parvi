[package]
name = "parvi-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parvi's native app: the shell that holds the pages areas register."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "parvi-app"
path = "src/main.rs"

[dependencies]
parvi-app-kit = { path = "../../kit/app-kit" }
parvi-core = { path = "../../kit/core" }
parvi-scheduled-app = { path = "../../areas/scheduled/app" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
async-channel = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux builds are for testing on an invisible X display; the product is Windows.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["x11"] }

[build-dependencies]
# gpui builds the same version for its own Windows resource.
embed-resource = "3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "io-util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
