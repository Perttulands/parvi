[package]
name = "parvi-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parvi's native app: the shell in a window, holding the pages areas register."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "parvi-app"
path = "src/main.rs"

[dependencies]
parvi-app-kit = { path = "../../kit/app-kit" }
parvi-app-shell = { path = "../../kit/app-shell" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
async-channel = "2"
log = "0.4"
# The pages, one line each, as in PAGES.
parvi-terminals-app = { path = "../../areas/terminals/app" }
parvi-scheduled-app = { path = "../../areas/scheduled/app" }
parvi-host-app = { path = "../../areas/host/app" }
parvi-work-app = { path = "../../areas/work/app" }

# Linux builds are for testing on an invisible X display; the product is Windows.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["x11"] }

[build-dependencies]
# gpui builds the same version for its own Windows resource.
embed-resource = "3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
