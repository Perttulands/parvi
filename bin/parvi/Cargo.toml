[package]
name = "parvi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parvi-node-kit = { path = "../../kit/node-kit" }
parvi-core = { path = "../../kit/core" }
anyhow = "1"
axum = { version = "0.8", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# The areas, one line each, as in AREAS.
parvi-agents = { path = "../../areas/agents/node" }
parvi-terminals = { path = "../../areas/terminals/node" }
parvi-scheduled = { path = "../../areas/scheduled/node" }
parvi-host = { path = "../../areas/host/node" }
parvi-work = { path = "../../areas/work/node" }
parvi-brain = { path = "../../areas/brain/node" }
parvi-files = { path = "../../areas/files/node" }
parvi-missions = { path = "../../areas/missions/node" }

[dev-dependencies]
parvi-testkit = { path = "../../kit/testkit" }
jiff = "0.2"
toml = { version = "1", default-features = false, features = ["parse", "std"] }
