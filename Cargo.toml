[workspace]
resolver = "3"
# Every crate is found where the layout puts it, so a new area needs no
# line here (bin/parvi/tests/layout.rs).
members = ["kit/*", "engine/*", "areas/*/*", "bin/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[workspace.lints.clippy]
# Frame kinds are slices of ranges (`parvi_core::frame::Kinds`): an area
# owning one range writes `&[0x60..=0x61]`, which this lint misreads.
single_range_in_vec_init = "allow"

# The desktop app unwinds, so a page that fails to draw is caught by its
# boundary and the rest of the window carries on:
# `cargo build --profile app -p parvi-app`.
[profile.app]
inherits = "release"
panic = "unwind"

# Many agents build from their own worktrees into one target folder. Full
# debug info and incremental caches for each filled the disk (262 GB), so a
# debug build keeps only what a backtrace needs and rebuilds a changed crate
# whole.
[profile.dev]
debug = "line-tables-only"
incremental = false
