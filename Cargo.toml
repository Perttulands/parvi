[workspace]
resolver = "3"
members = [
  "kit/core",
  "kit/node-kit",
  "kit/testkit",
  "engine/term",
  "engine/holder",
  "areas/terminals/contract",
  "areas/terminals/node",
  "bin/parvi",
  "kit/app-kit",
  "bin/parvi-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[workspace.lints.clippy]
# Frame kinds are slices of ranges (`parvi_core::frame::Kinds`): an area
# owning one range writes `&[0x60..=0x61]`, which this lint misreads.
single_range_in_vec_init = "allow"

# The desktop app unwinds, so a page that fails to draw is caught by its
# boundary and the rest of the window carries on:
# `cargo build --profile app -p parvi-app`.
[profile.app]
inherits = "release"
panic = "unwind"
