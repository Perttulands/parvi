[package]
name = "parvi-mission-model"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A mission's data as it crosses the wire: definition, layout, notes, authoring, runs and findings. No I/O."
publish = false

[dependencies]
parvi-core = { path = "../../kit/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
