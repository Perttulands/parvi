[package]
name = "parvi-term"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Parvi's terminal engine and session backends."
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
parvi-holder = { path = "../holder" }
serde_json = "1"

[dev-dependencies]
parvi-testkit = { path = "../../kit/testkit" }
vt100-upstream = { package = "vt100", git = "https://github.com/doy/vt100-rust.git", rev = "eb66ffaf7d771c13303ef73b29f6f2a56fdacecf" }
