[[gate]]
id = "gate_versiononly"
kinds = ["code"]
checkVersion = "1"

[[end]]
id = "end_done"
title = "Done"
outcome = "done"

[[end]]
id = "end_lost"
title = "Lost"
outcome = "rejected"

[[connection]]
id = "edge_start"
from = "inp:out"
to = "fmn_a:in"

[[connection]]
id = "edge_second_feed"
from = "inp:out"
to = "fmn_a:in"

[[connection]]
id = "edge_ab"
from = "fmn_a:out"
to = "gate_mixed:in"

[[connection]]
id = "edge_pass"
from = "gate_mixed:pass"
to = "fmn_b:in"

[[connection]]
id = "edge_pushback"
from = "gate_mixed:fail"
to = "fmn_a:in"

[[connection]]
id = "edge_done"
from = "fmn_b:out"
to = "end_done:in"

[[connection]]
id = "edge_done_again"
from = "gate_novalue:pass"
to = "end_done:in"

[[connection]]
id = "edge_from_nowhere"
from = "fmn_a:missing"
to = "fmn_b:out"

[[connection]]
id = "edge_bad_endpoint"
from = "inp"
to = "ghost:in"

[[connection]]
id = "edge_wrong_way"
from = "end_done:in"
to = "inp:out"
