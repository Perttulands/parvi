[[formation.output]]
id = "out"
label = "Result"
[[formation.output]]
id = "extra"
label = "Extra"
[[formation.slot]]
id = "a"
harness = "claude-code"
effort = "low"

[[formation]]
id = "fmn_b"
type = "solo"
title = "Second"
[[formation.input]]
id = "in"
label = "Input"
[[formation.output]]
id = "out"
label = "Result"
[[formation.slot]]
id = "b"
harness = "claude-code"
effort = "low"

[[formation]]
id = "fmn_island"
type = "solo"
[[formation.input]]
id = "in"
[[formation.output]]
id = "out"
[[formation.slot]]
id = "island"
harness = "pi"
effort = "high"

[[gate]]
id = "gate_nokind"
title = "No kind"

[[gate]]
id = "gate_mixed"
