[package]
name = "parvi-missions"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Parvi's mission engine: its store, its validation and its runs."
repository = "https://github.com/Perttulands/parvi"
publish = false

[dependencies]
parvi-mission-model = { path = "../mission-model" }
parvi-core = { path = "../../kit/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", features = ["serde"] }
sha2 = "0.10"
getrandom = "0.4"
libc = "0.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
parvi-term = { path = "../term" }
parvi-work-ref = { path = "../work-ref" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
